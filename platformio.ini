[platformio]
default_envs = esp01_1m
src_dir = .

[env:esp01_1m]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
build_src_filter = +<ESP8266_AscomSwitch.ino> +<ESP8266_AscomSwitch.ino.cpp>
lib_extra_dirs = ../libraries
lib_ldf_mode = chain+
lib_ignore = WebSockets
build_flags =
    -I../libraries/ASCOM_rest
    -DWEBSOCKET_DISABLED=true
monitor_speed = 115200
upload_speed = 115200
